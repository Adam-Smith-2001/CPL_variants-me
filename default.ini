output = tCl,pCl,lCl,mPk
lensing = yes
non linear = hmcode

# match your extra_args
N_ncdm = 1
m_ncdm = 0.06
N_ur = 2.046
#sBBN file = sBBN_2017.dat
use_ppf = yes
varying_fundamental_constants = instantaneous

# cosmological baseline (pick either H0 or 100*theta_s)
100*theta_s = 1.0416
omega_b = 0.0224
omega_cdm = 0.12
tau_reio = 0.051
n_s = 0.965
A_s = 2.1e-9
T_cmb = 2.7255

# CPL fluid (if you want to test that path)
Omega_Lambda = 0
Omega_scf = 0
fluid_equation_of_state = CLP
w0_fld = -0.9
wa_fld = -0.5
cs2_fld = 1

# make sure pk range is big enough for hmcode
P_k_max_h/Mpc = 20.
z_pk = 0
l_max_scalars = 2500

# verbosity
input_verbose = 1
background_verbose = 1
thermodynamics_verbose = 1
perturbations_verbose = 1
transfer_verbose = 1
primordial_verbose = 1
harmonic_verbose = 1
fourier_verbose = 1
lensing_verbose = 1
output_verbose = 1